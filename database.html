<!DOCTYPE html>
<html lang="ckb" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>تۆمارکردنی ئاگادارکردنەوە</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="pwa.css">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SmartQarz">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></symbol>
</svg>

<header class="topbar">
  <button class="icon-btn back" id="backBtn" aria-label="گەڕانەوە" hidden><svg class="ic"><use href="#i-arrow"/></svg></button>
  <h1 id="title">تۆمارکردنی ئاگادارکردنەوە</h1>
</header>

<main>
  <section class="view" id="v-list">
    <div class="center-stack">
      <button class="btn white press" id="newBtn"><svg class="ic"><use href="#i-plus"/></svg><span>دروستکردن</span></button>
    </div>
    <h2 class="section-title">دروستکراوەکان</h2>
    <div id="createdList" class="list"></div>
    <div id="emptyList" class="empty" hidden>هیچ ئاگادارکردنەوەیەک نیە</div>
  </section>

  <section class="view" id="v-create" hidden>
    <form id="noteForm" class="card form" novalidate>
      <p class="center-heading">وتەکەت بنووسە:</p>
      <textarea id="noteText" class="tall" rows="7"></textarea>
      <button class="btn save press" type="submit"><svg class="ic"><use href="#i-save"/></svg><span id="saveLabel">دروستکردن</span></button>
    </form>
  </section>
</main>

<p class="footer"><span class="sq-foot">پارێزراوە بۆ تیمی شابڵۆد ٢٠٢٦</span></p>

<div id="toasts" class="toasts" aria-live="polite"></div>

<dialog id="confirm">
  <p id="confirmText"></p>
  <div class="row">
    <button class="btn ghost" id="cancelDel">هەڵوەشاندنەوە</button>
    <button class="btn danger" id="okDel">بەڵێ، بسڕەوە</button>
  </div>
</dialog>

<script src="shared.js"></script>
<script src="database.js"></script>
<script src="pwa.js"></script>
</body>
</html>
